<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parser</title>
    <script>
      // Paint the last-used theme before React mounts, so there's no
      // flash of the default theme while usePreference's network round
      // trip is still in flight. Mirrors the storageKey convention in
      // usePreference('theme', ...): `pref:theme`.
      try {
        var stored = localStorage.getItem('pref:theme')
        var name = stored ? JSON.parse(stored).name : null
        document.documentElement.setAttribute('data-theme', name || 'gruvbox')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'gruvbox')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
